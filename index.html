<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aktivitas Harian</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #e0f2f1, #ffffff);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 60px 20px;
    }

    .container {
      background: white;
      padding: 30px 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 500px;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      text-align: center;
      color: #00695c;
      margin-bottom: 20px;
      font-size: 2em;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px;
      border: 2px solid #c8e6c9;
      border-radius: 10px;
      font-size: 1em;
      margin-bottom: 12px;
      transition: border-color 0.3s;
    }

    input[type="text"]:focus {
      border-color: #2e7d32;
      outline: none;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #2e7d32;
      color: white;
      font-size: 1em;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: #1b5e20;
    }

    ul {
      list-style: none;
      padding-left: 0;
      margin-top: 24px;
    }

    li {
      position: relative;
      background: #e8f5e9;
      padding: 16px 20px;
      border-radius: 12px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .task-text {
      flex: 1;
      color: #333;
      font-size: 1em;
    }

    .remove {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.05); /* Warna awal abu muda transparan */
      border: none;
      color: #555;
      font-size: 1.1em;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s, color 0.3s, transform 0.2s;
    }

    .remove:hover {
      background: #f28b82; /* Merah salmon lembut */
      color: white;
      transform: scale(1.1);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Aktivitas Harian</h1>
    <input type="text" id="taskInput" placeholder="Tulis aktivitas hari ini...">
    <button onclick="addTask()">Tambah Aktivitas</button>
    <ul id="taskList"></ul>
  </div>

  <script>
    function addTask() {
      const input = document.getElementById('taskInput');
      const taskText = input.value.trim();

      if (taskText === '') {
        alert('Tolong isi aktivitas terlebih dahulu.');
        return;
      }

      const li = document.createElement('li');

      const span = document.createElement('span');
      span.textContent = taskText;
      span.className = 'task-text';

      const removeBtn = document.createElement('button');
      removeBtn.textContent = '×'; // Ikon silang elegan
      removeBtn.className = 'remove';
      removeBtn.onclick = function () {
        li.remove();
      };

      li.appendChild(span);
      li.appendChild(removeBtn);
      document.getElementById('taskList').appendChild(li);

      input.value = '';
      input.focus();
    }
  </script>
</body>
</html>
